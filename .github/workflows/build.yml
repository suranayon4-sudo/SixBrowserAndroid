name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o SixBrowserAndroid-GitHubReady.zip -d project

      - name: Fix JVM target
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'sourceCompatibility = JavaVersion.VERSION_1_8',
              'sourceCompatibility = JavaVersion.VERSION_17'
          )

          s = s.replace(
              'targetCompatibility = JavaVersion.VERSION_1_8',
              'targetCompatibility = JavaVersion.VERSION_17'
          )

          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          p.write_text(s)
          print("JVM target diperbaiki ke Java 17")

          print("--- build.gradle.kts ---")
          print(p.read_text())
          PY

      - name: Build APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SixBrowser-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
