name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o SixBrowserAndroid-GitHubReady.zip -d project

      - name: Fix Java and Kotlin JVM target
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
              )

          if "kotlinOptions" not in s:
              s = s.replace(
                  "\n}",
                  """
          
          kotlinOptions {
              jvmTarget = "17"
          }
          """,
                  1
              )

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SixBrowser-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
