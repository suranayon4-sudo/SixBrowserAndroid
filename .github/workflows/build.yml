name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip project
        run: |
          unzip -o SixBrowserAndroid-GitHubReady.zip -d project

      - name: Build APK
        working-directory: project/SixBrowserAndroid
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SixBrowser-debug-apk
          path: project/SixBrowserAndroid/app/build/outputs/apk/debug/app-debug.apk
